<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Room Test</title>
  <style>
    body { background: #111; display: flex; flex-direction: column; align-items: center; padding: 20px; font-family: sans-serif; color: white; }
    .container { position: relative; width: 400px; height: auto; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    svg { display: block; width: 100%; height: auto; }
    .buttons { margin-top: 15px; display: flex; gap: 10px; }
    button { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Real Living Room - Paint Preview Test</h2>

      </defs>
      
      <!-- Base photograph -->
      <image href="/living-room-real.jpg" width="576" height="1024" />

      <!-- Color overlay -->
      <rect id="wallColor" width="576" height="1024" fill="#FBE0D0" mask="url(#wall-mask)" style="mix-blend-mode: multiply; opacity: 0.85; transition: fill 0.3s;" />
      <rect id="wallTint" width="576" height="1024" fill="#FBE0D0" mask="url(#wall-mask)" style="mix-blend-mode: color; opacity: 0.35; transition: fill 0.3s;" />
    </svg>
  </div>
  <div class="buttons">
    <button onclick="setColor('#FBE0D0')" style="background: #FBE0D0; color: #333;">Peach</button>
    <button onclick="setColor('#3D5A80')" style="background: #3D5A80; color: white;">Ocean Blue</button>
    <button onclick="setColor('#606C38')" style="background: #606C38; color: white;">Sage Green</button>
    <button onclick="setColor('#BC6C25')" style="background: #BC6C25; color: white;">Terracotta</button>
    <button onclick="setColor('#E9D8A6')" style="background: #E9D8A6; color: #333;">Warm Cream</button>
  </div>
  <script>
    function setColor(c) {
      document.getElementById('wallColor').setAttribute('fill', c);
      document.getElementById('wallTint').setAttribute('fill', c);
    }
  </script>
</body>
</html>
